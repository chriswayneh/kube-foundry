<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>kube-foundry shop</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main>
      <p class="eyebrow">KUBERNETES, BUILT IN LAYERS</p>
      <h1>kube-foundry shop</h1>
      <p>A deliberately tiny UI riding on a production-shaped platform.</p>
      <form id="item-form">
        <label for="name">New item</label>
        <div class="row">
          <input id="name" name="name" maxlength="120" required placeholder="e.g. brass gear">
          <button type="submit">Create</button>
        </div>
      </form>
      <p id="message" role="status"></p>
      <ul id="items"></ul>
    </main>
    <script src="app.js"></script>
  </body>
</html>
