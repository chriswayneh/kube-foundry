apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: worker
    app.kubernetes.io/name: shop
    app.kubernetes.io/part-of: kube-foundry
  name: worker
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.worker.replicas }}
  # Single worker only: never run an old and a new pod side by side, because
  # each one requeues the shared jobs:processing list at startup.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: worker
      app.kubernetes.io/name: shop
  template:
    metadata:
      labels:
        app.kubernetes.io/component: worker
        app.kubernetes.io/name: shop
        app.kubernetes.io/part-of: kube-foundry
    spec:
      serviceAccountName: worker
      automountServiceAccountToken: false
      containers:
      - env:
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              key: POSTGRES_DB
              name: {{ .Values.existingSecret }}
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              key: POSTGRES_USER
              name: {{ .Values.existingSecret }}
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              key: POSTGRES_PASSWORD
              name: {{ .Values.existingSecret }}
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              key: REDIS_PASSWORD
              name: {{ .Values.existingSecret }}
        - name: PGHOST
          value: postgres
        - name: PGPORT
          value: "5432"
        - name: REDIS_HOST
          value: redis
        envFrom:
        - configMapRef:
            name: shop-config
        image: {{ .Values.worker.image | quote }}
        imagePullPolicy: IfNotPresent
        name: worker
        startupProbe:
          exec:
            command: ["sh", "-c", "test -f /tmp/worker-heartbeat"]
          periodSeconds: 3
          failureThreshold: 40
        livenessProbe:
          exec:
            command: ["sh", "-c", "test $(( $(date +%s) - $(stat -c %Y /tmp/worker-heartbeat) )) -lt 30"]
          periodSeconds: 10
          failureThreshold: 3
        resources:
{{ toYaml .Values.worker.resources | indent 10 }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 10001
          runAsNonRoot: true
          runAsUser: 10001
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - mountPath: /tmp
          name: tmp
      volumes:
      - emptyDir: {}
        name: tmp
