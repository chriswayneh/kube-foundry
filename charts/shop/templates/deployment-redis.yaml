apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: redis
    app.kubernetes.io/name: shop
    app.kubernetes.io/part-of: kube-foundry
  name: redis
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: redis
      app.kubernetes.io/name: shop
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/component: redis
        app.kubernetes.io/name: shop
        app.kubernetes.io/part-of: kube-foundry
    spec:
      containers:
      - args:
        - exec redis-server --appendonly yes --requirepass "$REDIS_PASSWORD"
        command:
        - sh
        - -ec
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              key: REDIS_PASSWORD
              name: {{ .Values.existingSecret }}
        image: {{ .Values.redis.image | quote }}
        imagePullPolicy: IfNotPresent
        livenessProbe:
          exec:
            command:
            - sh
            - -ec
            - REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli ping | grep -q PONG
          failureThreshold: 6
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 3
        name: redis
        ports:
        - containerPort: 6379
          name: redis
        readinessProbe:
          exec:
            command:
            - sh
            - -ec
            - REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli ping | grep -q PONG
          failureThreshold: 6
          periodSeconds: 5
          timeoutSeconds: 3
        resources:
{{ toYaml .Values.redis.resources | indent 10 }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsGroup: 1000
          runAsNonRoot: true
          runAsUser: 999
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - mountPath: /data
          name: data
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 999
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: redis-data
