apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-shop-gateway
  namespace: {{ .Release.Namespace }}
spec:
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: {{ .Values.gateway.controllerNamespace }}
      podSelector:
        matchLabels:
          gateway.envoyproxy.io/owning-gateway-name: shop
          gateway.envoyproxy.io/owning-gateway-namespace: {{ .Release.Namespace }}
    ports:
    - port: 8000
      protocol: TCP
    - port: 8080
      protocol: TCP
  podSelector:
    matchExpressions:
    - key: app.kubernetes.io/component
      operator: In
      values:
      - api
      - web
  policyTypes:
  - Ingress
