apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: shop
  namespace: {{ .Release.Namespace }}
spec:
  hostnames:
  - {{ .Values.gateway.hostname }}
  parentRefs:
  - name: shop
    sectionName: http
  - name: shop
    sectionName: https
  rules:
  - backendRefs:
    - name: api
      port: 8000
    matches:
    - path:
        type: PathPrefix
        value: /api
  - backendRefs:
    - name: web
      port: 8080
    matches:
    - path:
        type: PathPrefix
        value: /
