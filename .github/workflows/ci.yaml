name: CI
'on':
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1
        with:
          version: v3.22.0
      - uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d  # v5.1.0
        with:
          version: v1.37.0
      - run: python -m pip install -r requirements-ci.txt
      - name: Lint source and YAML
        run: |
          git ls-files '*.yaml' '*.yml' ':!:charts/shop/templates/**' \
            ':!:gitops/apps/shop/base/shop.yaml' ':!:examples/secrets/dummy-secret.enc.yaml' | xargs yamllint
          yamllint -d relaxed gitops/apps/shop/base/shop.yaml examples/secrets/dummy-secret.enc.yaml
          ruff check app scripts
          python -m unittest discover -s scripts -p 'test_*.py'
      - name: Render charts and all delivery profiles
        run: make validate
  images:
    if: github.event_name == 'pull_request'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        component: [api, worker, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Build and scan
        run: bash scripts/ci-image.sh '${{ matrix.component }}' scan
