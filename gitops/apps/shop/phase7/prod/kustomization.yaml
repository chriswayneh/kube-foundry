apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../overlays/prod
  - ../common
replicas:
  - name: web
    count: 3
patches:
  - target:
      kind: Deployment
      name: api
    patch: |-
      - op: remove
        path: /spec/replicas
  - target:
      kind: HorizontalPodAutoscaler
      name: api
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
      - op: replace
        path: /spec/maxReplicas
        value: 6
