apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform
  namespace: argocd
spec:
  project: kube-foundry-platform
  sources:
    - repoURL: https://github.com/chriswayneh/kube-foundry.git
      targetRevision: main
      path: gitops/platform/monitoring
    - repoURL: https://github.com/chriswayneh/kube-foundry.git
      targetRevision: main
      path: gitops/platform
      directory:
        include: gatewayclass.yaml
    - repoURL: https://github.com/chriswayneh/kube-foundry.git
      targetRevision: main
      path: policy
      directory:
        include: shop-workloads.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
