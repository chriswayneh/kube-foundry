apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: shop
spec:
  template:
    spec:
      containers:
        - name: api
          envFrom:
            - configMapRef:
                name: shop-config
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: shop-runtime
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: shop-runtime
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shop-runtime
                  key: POSTGRES_PASSWORD
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shop-runtime
                  key: REDIS_PASSWORD
            - name: PGHOST
              value: postgres
            - name: PGPORT
              value: "5432"
            - name: REDIS_HOST
              value: redis
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2

