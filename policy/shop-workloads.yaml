    validatingAdmissionPolicy:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods/ephemeralcontainers]
  variables:
    - name: regularContainers
      expression: object.spec.containers + object.spec.?initContainers.orValue([])
    - name: allContainers
